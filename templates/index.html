<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Multi-Agent</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <h1>🌤️ Weather Multi-Agent</h1>

        <div id="chat-box"></div>

        <div id="token-info">

    <p><strong>Input Tokens:</strong> <span id="input-tokens">0</span></p>

    <p><strong>Output Tokens:</strong> <span id="output-tokens">0</span></p>

    <p><strong>Total Tokens:</strong> <span id="total-tokens">0</span></p>

</div>

        <div class="input-area">

            <input
                type="text"
                id="message"
                placeholder="Mesajınızı yazın..."
            >

            <button id="send-btn">
                Gönder
            </button>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/static/app.js"></script>

</body>

</html>
